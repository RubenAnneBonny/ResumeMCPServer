[project]
name = "resume-mcp-server"
version = "0.1.0"
description = "MCP server for generating tailored LaTeX resumes from a personal-info catalogue."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.scripts]
resume-mcp-server = "resume_mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_mcp_server"]
