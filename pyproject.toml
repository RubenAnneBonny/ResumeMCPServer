[project]
name = "resume-mcp-server"
version = "0.1.0"
description = "MCP server for generating tailored LaTeX resumes from a personal-info catalogue."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
resume-mcp-server = "resume_mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/resume_mcp_server"]
